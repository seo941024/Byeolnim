name: Collect Coordi Data

# 코디 시뮬레이터 아이템 층 데이터를 maplestory.io에서 받아 Vercel Blob에 올린다.
# 한 번에 약 5시간 40분만 돌고 멈추며, 다음 실행이 진행 기록을 읽어 이어 받는다.
# 다 받으면 할 일이 없어 바로 끝난다. 설계: COORDI_DESIGN.md
on:
  # 예약 실행은 꺼 둠 — 지금은 PC에서 tools/coordi_collect.js --local로 받는다(2026-10-21).
  # 다시 Actions로 돌리려면 아래 두 줄의 주석을 푼다
  # schedule:
  #   - cron: '30 */6 * * *'   # 6시간마다
  workflow_dispatch:          # 수동 실행 버튼

# 이전 실행이 아직 돌고 있으면 새 실행은 기다린다(같은 진행 기록을 동시에 쓰지 않게)
concurrency:
  group: coordi-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: GMS_WEEK_BOSS
        # 진행 기록(manifest.json)을 같은 이름으로 덮어써야 해서 allowOverwrite가 있는 1.x를 쓴다.
        # 사이트(package.json)의 0.27.3과는 따로이고, --no-save라 package.json은 그대로
        run: npm install --no-save @vercel/blob@1.0.0

      - name: Collect
        working-directory: GMS_WEEK_BOSS
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TIME_BUDGET_MIN: '340'
        run: node tools/coordi_collect.js
